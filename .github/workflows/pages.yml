name: Deploy Lexicon books and auxiliary inspector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/inspector-build.yml
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: lexicon-inspector-qualification
          path: .
      - name: Verify the exact downloaded artifact and source commit
        run: python -B browser/inspector/verify-site.py --expected-commit "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages/LEXICON
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
